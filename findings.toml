# What the security review of the help desk found, most serious first.
# Each finding has a regression test: it fails while the finding is open.

scope = "app.py, its packages, its Dockerfile and image, on this computer"

[[finding]]
id = "F1"
title = "Any customer can read any ticket"
severity = "High"
found_by = "hand test"
test = "security_tests/test_ticket_access.py"

[[finding]]
id = "F2"
title = "Search words can change the SQL query"
severity = "High"
found_by = "Semgrep"
test = "security_tests/test_search_query.py"

[[finding]]
id = "F3"
title = "The chat assistant gives out a staff code"
severity = "Medium"
found_by = "hand test"
test = "security_tests/test_chat_instructions.py"

[[finding]]
id = "F4"
title = "Jinja2 3.1.4 has known vulnerabilities"
severity = "Low"
found_by = "Grype"
test = "security_tests/test_dependencies.py"

[[finding]]
id = "F5"
title = "The image is large and runs as root"
severity = "Low"
found_by = "Grype"
test = "security_tests/test_image.py"
