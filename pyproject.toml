[project]
name = "help-desk-review-examples"
version = "1.0.0"
description = "A small help desk app with a chat feature, reviewed, fixed and checked"
requires-python = "==3.12.*"
dependencies = [
    "flask==3.1.3",
    "jinja2==3.1.4",
    "werkzeug==3.1.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["security_tests"]
pythonpath = ["."]
